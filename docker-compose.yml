services:
  app:
    image: ghcr.io/bardesss/minimalpoi:latest
    # For local development against source instead of the published image,
    # comment out `image:` above and uncomment:
    # build: .
    ports:
      - "7676:7676"
    # MINIMALPOI_DATA_DIR=/data is already baked into the image (see Dockerfile).
    # PUID/PGID set the user the app runs as (default 10001); match your host
    # user when bind-mounting. To pin the encryption key across hosts, set
    # SECRET_KEY too. Behind a reverse proxy, set TRUST_PROXY=1 (and optionally
    # FORWARDED_ALLOW_IPS to your proxy's IP) so the app sees the real client
    # IP and https scheme — see README "Behind a reverse proxy". Uncomment any
    # you need:
    # environment:
    #   - PUID=1000
    #   - PGID=1000
    #   - SECRET_KEY=change-me   # otherwise auto-generated into /data/secret.key
    #   - TRUST_PROXY=1
    #   - FORWARDED_ALLOW_IPS=*
    volumes:
      - minimalpoi-data:/data
    restart: unless-stopped

volumes:
  minimalpoi-data:
