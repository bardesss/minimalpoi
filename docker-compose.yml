services:
  app:
    image: ghcr.io/bardesss/minimalpoi:latest
    # For local development against source instead of the published image,
    # comment out `image:` above and uncomment:
    # build: .
    ports:
      - "7676:7676"
    # MINIMALPOI_DATA_DIR=/data is already baked into the image (see Dockerfile).
    # To pin the encryption key across hosts, uncomment and set a real value:
    # environment:
    #   - SECRET_KEY=change-me   # otherwise auto-generated into /data/secret.key
    volumes:
      - minimalpoi-data:/data
    restart: unless-stopped

volumes:
  minimalpoi-data:
