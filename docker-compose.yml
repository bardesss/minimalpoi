services:
  app:
    image: ghcr.io/bardesss/minimalpoi:latest
    # For local development against source instead of the published image,
    # comment out `image:` above and uncomment:
    # build: .
    ports:
      - "7676:7676"
    environment:
      - MINIMALPOI_DATA_DIR=/data
      # - SECRET_KEY=change-me   # optional; otherwise auto-generated into /data/secret.key
    volumes:
      - minimalpoi-data:/data
    restart: unless-stopped

volumes:
  minimalpoi-data:
