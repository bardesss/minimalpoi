[project]
name = "minimalpoi-backend"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["../LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
