# After changing anything under [project].dependencies or the extras below,
# refresh the lock (tests/test_dockerfile_deps.py fails until you do):
#
#   uv lock --project backend
#
# uv.lock is the only committed lock. CI installs it with `uv sync --frozen`,
# and the Dockerfile's `deps` stage turns it into a hash-pinned pin list with
# `uv export` at build time — so there is nothing else to regenerate by hand.
[project]
name = "minimalpoi-backend"
version = "1.0.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["../LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=11",
    "phonenumbers>=8.13",
    "slowapi>=0.1.9",
    "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "anyio>=4",
]
postgres = ["psycopg[binary]>=3.3.4"]

[tool.setuptools]
# Scope package discovery to the actual source package. Without this,
# setuptools' flat-layout auto-discovery trips over the gitignored runtime
# `data/` directory (created on first run: sqlite db, secret key, images) and
# refuses to build ("Multiple top-level packages discovered: ['app', 'data']").
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# All warnings are errors so regressions fail CI.
# The single targeted ignore is for a StarletteDeprecationWarning raised inside
# starlette.testclient (when imported with `httpx`) that nudges installing an
# `httpx2` package. We intentionally keep the well-established `httpx` and do
# NOT adopt `httpx2` (it has typosquat characteristics — a name mimicking the
# popular `httpx` and a `0.0.0` version on the index) pending verification.
# The warning fires inside third-party internals, so a narrow ignore is the
# safe way to keep test output pristine without installing the lookalike.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated:UserWarning",
    # slowapi calls the deprecated `asyncio.iscoroutinefunction` at decoration
    # time. Harmless on the supported Python 3.12 (where it isn't deprecated);
    # this narrow ignore keeps the suite green on newer interpreters too.
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning",
    # The `mcp` SDK's stateless streamable-HTTP transport spawns a per-request
    # task holding an anyio memory-object stream pair (see
    # StreamableHTTPSessionManager._handle_stateless_request). Our test suite
    # opens a fresh app lifespan per test (see tests/conftest.py `client`), so
    # that task gets cancelled the moment the test's TestClient exits rather
    # than unwinding on its own schedule; the stream is then only closed by
    # the garbage collector, which raises this ResourceWarning as an
    # "unraisable exception" well after the owning test has already passed.
    # Confirmed via isolated runs that this fires only on requests that
    # actually reach the mounted MCP transport (tests/test_mcp_transport.py,
    # tests/test_mcp_tool_call.py), never from application code — it's an
    # artifact of cancelling the SDK's background task mid-flight, not a leak
    # in MinimalPOI's own code.
    #
    # The message prefix is phrasing-independent on purpose: pytest formats the
    # unraisable as "Exception ignored while calling deallocator <...>" on some
    # versions and "Exception ignored in: <...>" on others, so we anchor on the
    # foreign `MemoryObjectReceiveStream.__del__` deallocator itself rather than
    # the prefix (the `:` in "in:" also can't appear in a filterwarnings message
    # field). Still scoped to this one SDK stream — not a blanket unraisable
    # ignore — so real resource leaks elsewhere still fail the suite.
    "ignore:Exception ignored.*MemoryObjectReceiveStream\\.__del__:pytest.PytestUnraisableExceptionWarning",
]
