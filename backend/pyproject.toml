[project]
name = "minimalpoi-backend"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["../LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Starlette 1.3+ renamed its HTTP client dependency from httpx to httpx2.
    # Use httpx2 to avoid StarletteDeprecationWarning in TestClient.
    "httpx2>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Turn all warnings into errors so future regressions fail CI.
# The one targeted ignore below is for the starlette/testclient.py deprecation
# that fires when the legacy `httpx` package (not `httpx2`) is installed.
# This is unavoidable from our code: the warning is raised inside third-party
# starlette internals (starlette/testclient.py:47) before we can intercept it.
# Remove this line once the venv is rebuilt with httpx2 installed.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated:UserWarning",
]
