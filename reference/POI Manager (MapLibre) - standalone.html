document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:center;justify-content:center;box-shadow:0 3px 10px rgba(79,70,229,.4)\">\n          <div style=\"width:9px;height:9px;border-radius:50%;background:#fff\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;line-height:1.05\">\n          <span style=\"font-weight:800;font-size:16px;letter-spacing:-.02em\">Waypoint<\u002Fspan>\n          <span style=\"font-weight:500;font-size:11px;color:#9a958f;letter-spacing:.01em\">Places manager<\u002Fspan>\n        <\u002Fdiv>\n        <button onclick=\"{{ onTogglePanel }}\" title=\"Collapse list\" style=\"margin-left:auto;width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid #e7e5e1;cursor:pointer;color:#6b655d;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0\" style-hover=\"background:#f4f5ff;border-color:#d7d5f7\">«<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Search -->\n    <div style=\"padding:14px 20px 4px 20px\">\n      <div style=\"position:relative\">\n        <span style=\"position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#b3aea7;font-size:14px\">⌕<\u002Fspan>\n        <input value=\"{{ search }}\" oninput=\"{{ onSearch }}\" placeholder=\"Search places or addresses\" style=\"width:100%;padding:10px 12px 10px 32px;border:1px solid #e7e5e1;border-radius:10px;font-family:inherit;font-size:13.5px;background:#fafaf9;outline:none;color:#1a1a1a\" style-focus=\"border-color:#4f46e5;background:#fff\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Category chips -->\n    <div style=\"padding:12px 20px 12px 20px;display:flex;flex-wrap:wrap;gap:7px\">\n      <button onclick=\"{{ onClearCats }}\" style=\"{{ allChipStyle }}\">All<\u002Fbutton>\n      <sc-for list=\"{{ cats }}\" as=\"cat\" hint-placeholder-count=\"7\">\n        <button onclick=\"{{ cat.onToggle }}\" style=\"{{ cat.chipStyle }}\">\n          <span style=\"width:8px;height:8px;border-radius:50%;background:{{ cat.dotColor }};display:inline-block\"><\u002Fspan>\n          {{ cat.label }}\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- Meta -->\n    <div style=\"padding:4px 20px 10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f1f0ee\">\n      <span style=\"font-size:12px;font-weight:700;color:#1a1a1a\">{{ count }} <span style=\"color:#9a958f;font-weight:500\">places shown<\u002Fspan><\u002Fspan>\n      <button onclick=\"{{ onFitResults }}\" style=\"font-family:inherit;font-size:11.5px;font-weight:600;color:#5c574f;background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px\">Fit map to results<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- List -->\n    <div class=\"poi-scroll\" style=\"flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:10px;align-content:start\">\n      <sc-for list=\"{{ filtered }}\" as=\"poi\" hint-placeholder-count=\"10\">\n        <div onclick=\"{{ poi.onClick }}\" style=\"{{ poi.cardStyle }}\" style-hover=\"border-color:#d7d5f7;transform:translateY(-1px)\">\n          <div style=\"flex:none;height:78px;min-height:78px;background-color:{{ poi.tintColor }};background-size:cover;background-position:center;background-image:{{ poi.thumbCss }};position:relative\">\n            <span style=\"position:absolute;left:8px;top:8px;width:18px;height:18px;border-radius:50%;background:{{ poi.color }};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:block\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px;min-width:0\">\n            <span style=\"font-weight:700;font-size:13.5px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ poi.name }}<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:600;color:#6b655d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ poi.categoryLabel Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DETAIL PANEL -->\n    <sc-if value=\"{{ detailOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;top:0;left:0;bottom:0;width:368px;z-index:800;background:#fff;box-shadow:6px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column;animation:slideIn .22s ease;overflow:hidden\">\n        <div class=\"poi-scroll\" style=\"flex:1;overflow-y:auto\">\n          <div style=\"position:relative;height:208px;background-color:{{ selected.tintColor }};background-size:cover;background-position:center;background-image:{{ selected.photoCss }}\">\n            <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.02) 100%)\"><\u002Fdiv>\n            <button onclick=\"{{ onCloseDetail }}\" style=\"position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:16px;color:#1a1a1a;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)\">✕<\u002Fbutton>\n            <div style=\"position:absolute;left:18px;bottom:14px;display:flex;align-items:center;gap:7px;background:{{ selected.color }};color:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)\">\n              <span style=\"width:7px;height:7px;border-radius:50%;background:#fff;display:inline-block\"><\u002Fspan>{{ selected.categoryLabel }}\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:18px 20px 20px 20px;display:flex;flex-direction:column;gap:16px\">\n            <div>\n              <h2 style=\"margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15\">{{ selected.name }}<\u002Fh2>\n              <div style=\"display:flex;align-items:flex-start;gap:7px;margin-top:8px;color:#6b655d;font-size:13.5px\">\n                <span style=\"margin-top:1px\">📍<\u002Fspan><span>{{ selected.address }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#a8a39b;margin-top:6px;margin-left:23px\">{{ selected.coordText }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:1px;border:1px solid #f1f0ee;border-radius:12px;overflow:hidden\">\n              <div style=\"display:flex;align-items:center;gap:11px;padding:11px 14px;background:#fafaf9\">\n                <span style=\"font-size:13px;width:18px;text-align:center\">✆<\u002Fspan>\n                <span style=\"font-size:13px;color:#46413a;font-weight:500\">{{ selected.phone }}<\u002Fspan>\n              <\u002Fdiv>\n              <a href=\"{{ selected.websiteHref }}\" target=\"_blank\" style=\"display:flex;align-items:center;gap:11px;padding:11px 14px;background:#fafaf9;text-decoration:none;border-top:1px solid #f1f0ee\" style-hover=\"background:#f3f2f0\">\n                <span style=\"font-size:13px;width:18px;text-align:center\">⬡<\u002Fspan>\n                <span style=\"font-size:13px;color:#2563eb;font-weight:600\">{{ selected.website }}<\u002Fspan>\n              <\u002Fa>\n              <a href=\"{{ selected.mailHref }}\" style=\"display:flex;align-items:center;gap:11px;padding:11px 14px;background:#fafaf9;text-decoration:none;border-top:1px solid #f1f0ee\" style-hover=\"background:#f3f2f0\">\n                <span style=\"font-size:13px;width:18px;text-align:center\">✉<\u002Fspan>\n                <span style=\"font-size:13px;color:#46413a;font-weight:500\">{{ selected.email }}<\u002Fspan>\n              <\u002Fa>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#9a958f;margin-bottom:8px\">Tags<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                <sc-for list=\"{{ selected.tags }}\" as=\"tag\" hint-placeholder-count=\"3\">\n                  <span style=\"font-size:12px;font-weight:600;color:#5c574f;background:#f3f2f0;border-radius:7px;padding:5px 10px\">{{ tag }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#9a958f;margin-bottom:8px\">Notes<\u002Fdiv>\n              <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#46413a;text-wrap:pretty\">{{ selected.notes }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:9px;padding:14px 18px;border-top:1px solid #f1f0ee;background:#fff\">\n          <button onclick=\"{{ onEditSelected }}\" style=\"flex:1;background:#4f46e5;color:#fff;border:none;border-radius:10px;padding:11px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer\" style-hover=\"background:#4338ca\">Edit place<\u002Fbutton>\n          <button onclick=\"{{ onDeleteSelected }}\" style=\"background:#fff;color:#c0392b;border:1px solid #f0d4cf;border-radius:10px;padding:11px 16px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer\" style-hover=\"background:#fdf3f1\">Delete<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <!-- ADD / EDIT MODAL -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ onCancelModal }}\" style=\"position:fixed;inset:0;z-index:2000;background:rgba(26,24,22,.42);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;animation:fadeIn .16s ease;padding:24px\">\n      <div onclick=\"{{ stop }}\" style=\"width:540px;max-width:100%;max-height:90vh;overflow-y:auto;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.32);animation:popIn .2s ease\" class=\"poi-scroll\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:22px 24px 16px 24px;border-bottom:1px solid #f1f0ee;position:sticky;top:0;background:#fff;z-index:2\">\n          <h2 style=\"margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em\">{{ modalTitle }}<\u002Fh2>\n          <button onclick=\"{{ onCancelModal }}\" style=\"width:30px;height:30px;border-radius:8px;background:#f5f4f2;border:none;cursor:pointer;font-size:14px;color:#6b655d\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:20px 24px 8px 24px;display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Name<\u002Flabel>\n            <input value=\"{{ draft.name }}\" oninput=\"{{ setName }}\" placeholder=\"e.g. Café Modern\" style=\"{{ inputStyle }}\">\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px\">\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Category<\u002Flabel>\n              <select value=\"{{ draft.category }}\" onchange=\"{{ setCategory }}\" style=\"{{ inputStyle }}\">\n                <sc-for list=\"{{ cats }}\" as=\"cat\" hint-placeholder-count=\"7\">\n                  <option value=\"{{ cat.id }}\">{{ cat.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fselect>\n            <\u002Fdiv>\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Tags <span style=\"color:#b3aea7;font-weight:500\">(comma sep.)<\u002Fspan><\u002Flabel>\n              <input value=\"{{ draft.tagsText }}\" oninput=\"{{ setTags }}\" placeholder=\"popular, outdoor\" style=\"{{ inputStyle }}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Address<\u002Flabel>\n            <input value=\"{{ draft.address }}\" oninput=\"{{ setAddress }}\" placeholder=\"Street 12, Amsterdam\" style=\"{{ inputStyle }}\">\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px\">\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Latitude<\u002Flabel>\n              <input value=\"{{ draft.lat }}\" oninput=\"{{ setLat }}\" placeholder=\"52.3676\" style=\"{{ monoInputStyle }}\">\n            <\u002Fdiv>\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Longitude<\u002Flabel>\n              <input value=\"{{ draft.lng }}\" oninput=\"{{ setLng }}\" placeholder=\"4.9041\" style=\"{{ monoInputStyle }}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#9a958f;margin-top:-4px\">Tip: click anywhere on the map to drop the coordinates here.<\u002Fdiv>\n          <div style=\"display:flex;gap:12px\">\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Phone<\u002Flabel>\n              <input value=\"{{ draft.phone }}\" oninput=\"{{ setPhone }}\" placeholder=\"+31 20 000 0000\" style=\"{{ inputStyle }}\">\n            <\u002Fdiv>\n            <div style=\"flex:1\">\n              <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Email<\u002Flabel>\n              <input value=\"{{ draft.email }}\" oninput=\"{{ setEmail }}\" placeholder=\"info@place.nl\" style=\"{{ inputStyle }}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Website<\u002Flabel>\n            <input value=\"{{ draft.website }}\" oninput=\"{{ setWebsite }}\" placeholder=\"place.nl\" style=\"{{ inputStyle }}\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:700;color:#46413a;margin-bottom:6px\">Notes<\u002Flabel>\n            <textarea value=\"{{ draft.notes }}\" oninput=\"{{ setNotes }}\" placeholder=\"Anything worth remembering…\" rows=\"3\" style=\"{{ textareaStyle }}\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;justify-content:flex-end;padding:14px 24px 22px 24px;position:sticky;bottom:0;background:#fff\">\n          <button onclick=\"{{ onCancelModal }}\" style=\"background:#fff;color:#46413a;border:1px solid #e7e5e1;border-radius:10px;padding:11px 18px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer\" style-hover=\"background:#f6f5f3\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ onSaveModal }}\" style=\"background:#4f46e5;color:#fff;border:none;border-radius:10px;padding:11px 22px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer\" style-hover=\"background:#4338ca\">{{ saveLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SETTINGS & ADMIN -->\n  <sc-if value=\"{{ settingsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ onCloseSettings }}\" style=\"position:fixed;inset:0;z-index:2100;background:rgba(26,24,22,.42);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;animation:fadeIn .16s ease;padding:24px\">\n      <div onclick=\"{{ stop }}\" class=\"poi-scroll\" style=\"width:660px;max-width:100%;max-height:90vh;overflow-y:auto;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.32);animation:popIn .2s ease\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:22px 26px 18px 26px;border-bottom:1px solid #f1f0ee;position:sticky;top:0;background:#fff;z-index:2\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <div style=\"width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#4f46e5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px\">⚙<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;line-height:1.2\">\n              <h2 style=\"margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em\">Settings &amp; admin<\u002Fh2>\n              <span style=\"font-size:12px;color:#9a958f;font-weight:500\">Data, team access and map defaults<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ onCloseSettings }}\" style=\"width:30px;height:30px;border-radius:8px;background:#f5f4f2;border:none;cursor:pointer;font-size:14px;color:#6b655d\">✕<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"padding:22px 26px 26px 26px;display:flex;flex-direction:column;gap:20px\">\n\n          <!-- Data & backups -->\n          <div style=\"border:1px solid #f1f0ee;border-radius:14px;overflow:hidden\">\n            <div style=\"padding:14px 18px;background:#f4f5ff;border-bottom:1px solid #ecebff;display:flex;align-items:center;gap:10px\">\n              <span style=\"font-size:15px\">⇄<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;line-height:1.2\">\n                <span style=\"font-weight:800;font-size:13.5px;color:#3730a3\">Data &amp; backups<\u002Fspan>\n                <span style=\"font-size:11.5px;color:#8985b8\">Bulk import or export your places<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px\">\n                <div style=\"display:flex;flex-direction:column;line-height:1.35\">\n                  <span style=\"font-weight:700;font-size:13.5px;color:#1a1a1a\">Import places<\u002Fspan>\n                  <span style=\"font-size:12px;color:#9a958f\">Upload a CSV or GeoJSON file to add places in bulk.<\u002Fspan>\n                <\u002Fdiv>\n                <button onclick=\"{{ onImportClick }}\" style=\"flex-shrink:0;background:#fff;color:#4f46e5;border:1px solid #d7d5f7;border-radius:9px;padding:9px 15px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer\" style-hover=\"background:#f4f5ff\">Choose file<\u002Fbutton>\n                <input ref=\"{{ fileRef }}\" type=\"file\" accept=\".json,.geojson,.csv\" onchange=\"{{ onFileChange }}\" style=\"display:none\">\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;border-top:1px solid #f5f4f2\">\n                <div style=\"display:flex;flex-direction:column;line-height:1.35\">\n                  <span style=\"font-weight:700;font-size:13.5px;color:#1a1a1a\">Export all places<\u002Fspan>\n                  <span style=\"font-size:12px;color:#9a958f\">Download the current set as a GeoJSON FeatureCollection.<\u002Fspan>\n                <\u002Fdiv>\n                <button onclick=\"{{ onExport }}\" style=\"flex-shrink:0;background:#4f46e5;color:#fff;border:none;border-radius:9px;padding:9px 15px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer\" style-hover=\"background:#4338ca\">Export GeoJSON<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Team & access -->\n          <div style=\"border:1px solid #f1f0ee;border-radius:14px;overflow:hidden\">\n            <div style=\"padding:14px 18px;background:#fafaf9;border-bottom:1px solid #f1f0ee;display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"font-size:15px\">👥<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column;line-height:1.2\">\n                  <span style=\"font-weight:800;font-size:13.5px;color:#1a1a1a\">Team &amp; access<\u002Fspan>\n                  <span style=\"font-size:11.5px;color:#9a958f\">{{ memberCount }} people can manage these places<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button style=\"background:#fff;color:#4f46e5;border:1px solid #d7d5f7;border-radius:9px;padding:8px 13px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer\" style-hover=\"background:#f4f5ff\">+ Invite<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column\">\n              <sc-for list=\"{{ members }}\" as=\"m\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid #f7f6f4\">\n                  <div style=\"width:34px;height:34px;border-radius:50%;background:{{ m.avatarBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0\">{{ m.initials }}<\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25\">\n                    <span style=\"font-weight:700;font-size:13.5px;color:#1a1a1a\">{{ m.name }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;color:#9a958f\">{{ m.email }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"{{ m.roleStyle }}\">{{ m.role }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Map & display -->\n          <div style=\"border:1px solid #f1f0ee;border-radius:14px;overflow:hidden\">\n            <div style=\"padding:14px 18px;background:#fafaf9;border-bottom:1px solid #f1f0ee;display:flex;align-items:center;gap:10px\">\n              <span style=\"font-size:15px\">🗺<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;line-height:1.2\">\n                <span style=\"font-weight:800;font-size:13.5px;color:#1a1a1a\">Map &amp; display<\u002Fspan>\n                <span style=\"font-size:11.5px;color:#9a958f\">Choose the default base map style<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:16px 18px;display:flex;gap:10px\">\n              <button onclick=\"{{ onBasemapColor }}\" style=\"{{ bmColorStyle }}\">Color (Voyager)<\u002Fbutton>\n              <button onclick=\"{{ onBasemapLight }}\" style=\"{{ bmLightStyle }}\">Light / minimal<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.CATS = [\n      { id: 'restaurant', label: 'Restaurants', color: '#E1574C', tint: '#fbe6e3' },\n      { id: 'nature',     label: 'Nature',      color: '#2F9E63', tint: '#e0f0e7' },\n      { id: 'store',      label: 'Stores',      color: '#E0A22A', tint: '#faeed4' },\n      { id: 'cafe',       label: 'Cafés',       color: '#A86A3D', tint: '#efe2d6' },\n      { id: 'museum',     label: 'Museums',     color: '#7C5CC4', tint: '#e9e2f5' },\n      { id: 'realestate', label: 'Real estate', color: '#3B7DD8', tint: '#dde8f7' },\n      { id: 'adventure',  label: 'Adventure',   color: '#15A6A0', tint: '#d6f0ef' }\n    ];\n    this.catMap = {};\n    this.CATS.forEach(c => this.catMap[c.id] = c);\n    this.MEMBERS = [\n      { name: 'You', email: 'admin@viscohoreca.nl', role: 'Admin', initials: 'AV', color: '#4f46e5' },\n      { name: 'Sanne de Vries', email: 'sanne@viscohoreca.nl', role: 'Editor', initials: 'SV', color: '#2F9E63' },\n      { name: 'Tom Bakker', email: 'tom@viscohoreca.nl', role: 'Editor', initials: 'TB', color: '#E0A22A' },\n      { name: 'Lisa Janssen', email: 'lisa@viscohoreca.nl', role: 'Viewer', initials: 'LJ', color: '#7C5CC4' }\n    ];\n    this.mapRef = React.createRef();\n    this.fileRef = React.createRef();\n    this.markers = {};\n    this._prevFilterSig = null;\n    this._prevSelected = undefined;\n    this.state = {\n      pois: this.generate(),\n      search: '',\n      activeCats: [],\n      selectedId: null,\n      detailOpen: false,\n      modalOpen: false,\n      modalMode: 'add',\n      draft: this.emptyDraft(),\n      settingsOpen: false,\n      basemap: 'voyager',\n      panelCollapsed: false\n    };\n  }\n\n  emptyDraft() {\n    return { id: null, name: '', category: 'restaurant', address: '', lat: '', lng: '', phone: '', website: '', email: '', notes: '', tagsText: '' };\n  }\n\n  rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\n\n  generate() {\n    const rand = this.rng(20260622);\n    const pools = {\n      restaurant: ['De Kas','Brasserie Ambassade','Café Modern','Restaurant Floreyn','Bistro Bij Ons','Eetcafé De Brakke','Restaurant Daalder','De Silveren Spiegel','Restaurant Vinkeles','Restaurant Marius','De Plantage','Gartine','Wilde Zwijnen','Restaurant C','Toscanini','Lastage','Choux','Rijsel','Bar Spek','Guts & Glory'],\n      nature: ['Vondelpark','Westerpark','Amsterdamse Bos','Oosterpark','Flevopark','Beatrixpark','Sarphatipark','Rembrandtpark','Diemerpark','Erasmuspark','Frankendael','Gaasperplas','Sloterplas','Het Twiske','Nieuwe Meer','Amstelpark','Noorderpark','Wertheimpark','Rieker Polder','Waterland View'],\n      store: ['De Bijenkorf','Concept Store Noord','Atelier Goods','Six and Sons','X Bank','Hutspot','Restored','The Otherist','Pols Potten','Frozen Fountain','Droog','Cottoncake','Charlie + Mary','Sukha','Episode Vintage','Local Goods','We Are Vintage','Mercado','The Maker Store','Tinker Imports'],\n      cafe: ['Café de Jaren','Coffee & Coconuts','Bocca','Lot Sixty One','White Label','Scandinavian Embassy','Back to Black','Toki','Screaming Beans','Monks','Espressofabriek','Headfirst','Bakhuys','Drovers Dog','Sweet Cup','Lavinia','Two for Joy','De Koffieschenkerij','Coffeecompany','Caffènation'],\n      museum: ['Rijksmuseum','Van Gogh Museum','Stedelijk','Moco Museum','Anne Frank House','Hermitage','Scheepvaartmuseum','Tropenmuseum','Foam','Eye Filmmuseum','Rembrandthuis','Joods Museum','Huis Marseille','NEMO Science','Cobra Museum','Verzetsmuseum','Willet-Holthuysen','Tassenmuseum','Micropia','Stadsarchief'],\n      realestate: ['Herengracht 412','Keizersgracht 188','Jordaan Loft','De Pijp Apartment','Oud-Zuid Villa','Canal House 1660','IJburg New-build','Westerdok Penthouse','Vondel Townhouse','Oostpoort Flat','Houthavens Unit','Cruquius Loft','Zuidas Tower 14','Amstel Riverside','Noord Warehouse','Plantage Mansion','Rivierenbuurt Flat','Spaarndammer Home','Borneo Eiland Unit','Sloten Cottage'],\n      adventure: ['Tony\\u2019s Climbing','Klimbos Fun Forest','A\\u2019DAM Lookout Swing','Kayak Centrum','Wakeboard Cable Park','Indoor Skydive','Escape Amsterdam','Boulderhal Mountain','Paintball Arena','Karting Spaarnwoude','SUP Spot Amstel','Zipline Park','Trampoline Jump XL','GlowGolf','Laser Game','Aqua Bike Tour','Segway City','Archery Tag','Pedal Boat Rental','Night Run Club']\n    };\n    const districts = ['Centrum','Jordaan','De Pijp','Oost','Noord','West','Zuid','IJburg','Westerpark','Oud-West'];\n    const streets = ['Herengracht','Keizersgracht','Prinsengracht','Damrak','Rokin','Leidsestraat','Utrechtsestraat','Spuistraat','Haarlemmerdijk','Ferdinand Bolstraat','Van Woustraat','Javastraat','Overtoom','Linnaeusstraat','Weteringschans','Nieuwmarkt','Kinkerstraat','Bilderdijkstraat','Plantage Middenlaan','Sarphatistraat'];\n    const tagsPool = ['popular','new','verified','draft','outdoor','family','accessible','rooftop','historic','reservation','dog-friendly','vegan','wifi','parking','hidden gem','seasonal'];\n    const notesBy = {\n      restaurant: 'Seasonal menu, mostly local produce. Best to reserve for weekends.',\n      nature: 'Open green space, popular for walks and picnics. Free entry, dogs allowed off-path.',\n      store: 'Independent retailer with a curated selection. Quiet on weekday mornings.',\n      cafe: 'Specialty coffee and a small food menu. Good for working, plenty of seats.',\n      museum: 'Permanent and rotating exhibitions. Buy timed tickets online to skip the queue.',\n      realestate: 'Listed property under review. Photos from the latest viewing on file.',\n      adventure: 'Activity venue, booking required. Check weather and age restrictions first.'\n    };\n    const pick = (arr) => arr[Math.floor(rand() * arr.length)];\n    const slug = (s) => s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '').slice(0, 18) || 'place';\n    const out = [];\n    let n = 1;\n    this.CATS.forEach((cat, ci) => {\n      const pool = pools[cat.id];\n      const count = 22 + (ci % 3) * 2;\n      for (let i = 0; i < count; i++) {\n        const base = pool[i % pool.length];\n        const name = i >= pool.length ? base + ' \\u00b7 ' + districts[i % districts.length] : base;\n        const lat = 52.345 + rand() * 0.065;\n        const lng = 4.835 + rand() * 0.13;\n        const sl = slug(base) + (i >= pool.length ? (i % 9) : '');\n        const ntags = 1 + Math.floor(rand() * 3);\n        const tags = [];\n        while (tags.length < ntags) { const t = pick(tagsPool); if (!tags.includes(t)) tags.push(t); }\n        out.push({\n          id: 'poi-' + (n++),\n          name,\n          category: cat.id,\n          address: pick(streets) + ' ' + (1 + Math.floor(rand() * 280)) + ', Amsterdam',\n          lat, lng,\n          phone: '+31 20 ' + (300 + Math.floor(rand() * 600)) + ' ' + (1000 + Math.floor(rand() * 8999)),\n          website: sl + '.nl',\n          email: 'info@' + sl + '.nl',\n          tags,\n          notes: notesBy[cat.id]\n        });\n      }\n    });\n    return out;\n  }\n\n  // ---- derived ----\n  getFiltered() {\n    const q = this.state.search.trim().toLowerCase();\n    const active = this.state.activeCats;\n    return this.state.pois.filter(p => {\n      if (active.length && !active.includes(p.category)) return false;\n      if (q) { return (p.name + ' ' + p.address + ' ' + p.tags.join(' ')).toLowerCase().includes(q); }\n      return true;\n    });\n  }\n\n  photoFor(p, size) { return 'https://picsum.photos/seed/' + p.id + '/' + size + '/' + Math.round(size * 0.72); }\n\n  // ---- actions ----\n  toggleCat(id) {\n    this.setState(s => {\n      const a = s.activeCats.includes(id) ? s.activeCats.filter(x => x !== id) : [...s.activeCats, id];\n      return { activeCats: a };\n    });\n  }\n  clearCats() { this.setState({ activeCats: [] }); }\n  onSearch(e) { this.setState({ search: e.target.value }); }\n  select(id) { this.setState({ selectedId: id, detailOpen: true }); }\n  closeDetail() { this.setState({ detailOpen: false }); }\n\n  openAdd() {\n    const c = this.map ? this.map.getCenter() : { lat: 52.3676, lng: 4.9041 };\n    const d = this.emptyDraft();\n    d.lat = c.lat.toFixed(5); d.lng = c.lng.toFixed(5);\n    this.setState({ modalOpen: true, modalMode: 'add', draft: d });\n  }\n  openEdit() {\n    const p = this.state.pois.find(x => x.id === this.state.selectedId);\n    if (!p) return;\n    this.setState({ modalOpen: true, modalMode: 'edit', draft: {\n      id: p.id, name: p.name, category: p.category, address: p.address,\n      lat: String(p.lat.toFixed(5)), lng: String(p.lng.toFixed(5)),\n      phone: p.phone, website: p.website, email: p.email, notes: p.notes,\n      tagsText: p.tags.join(', ')\n    } });\n  }\n  cancelModal() { this.setState({ modalOpen: false }); }\n  togglePanel() { this.setState(s => ({ panelCollapsed: !s.panelCollapsed }), () => { if (this.map) setTimeout(() => this.map.resize(), 280); }); }\n  openSettings() { this.setState({ settingsOpen: true }); }\n  closeSettings() { this.setState({ settingsOpen: false }); }\n  styleUrl(kind) { return kind === 'light' ? 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json' : 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json'; }\n  setBasemap(kind) {\n    if (this.state.basemap === kind) return;\n    this.setState({ basemap: kind });\n    if (this.map) {\n      this.map.setStyle(this.styleUrl(kind));\n      this.map.once('styledata', () => this.addPoiLayers());\n    }\n  }\n  colorMatch() {\n    const m = ['match', ['get', 'category']];\n    this.CATS.forEach(c => { m.push(c.id, c.color); });\n    m.push('#888');\n    return m;\n  }\n  poiFC(list) {\n    return { type: 'FeatureCollection', features: list.map(p => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [p.lng, p.lat] }, properties: { id: p.id, category: p.category, name: p.name } })) };\n  }\n  refreshData() { if (this.map && this.map.getSource('pois')) this.map.getSource('pois').setData(this.poiFC(this.getFiltered())); }\n  addPoiLayers() {\n    const map = this.map; if (!map) return;\n    const color = this.colorMatch();\n    if (!map.getSource('pois')) {\n      map.addSource('pois', { type: 'geojson', data: this.poiFC(this.getFiltered()), cluster: true, clusterMaxZoom: 13, clusterRadius: 50 });\n    } else { map.getSource('pois').setData(this.poiFC(this.getFiltered())); }\n    if (!map.getLayer('clusters')) map.addLayer({ id: 'clusters', type: 'circle', source: 'pois', filter: ['has', 'point_count'], paint: { 'circle-color': '#ffffff', 'circle-stroke-color': '#1a1a1a', 'circle-stroke-width': 1.5, 'circle-radius': ['step', ['get', 'point_count'], 16, 10, 20, 50, 26] } });\n    if (!map.getLayer('cluster-count')) map.addLayer({ id: 'cluster-count', type: 'symbol', source: 'pois', filter: ['has', 'point_count'], layout: { 'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['Open Sans Bold'], 'text-size': 13 }, paint: { 'text-color': '#1a1a1a' } });\n    if (!map.getLayer('unclustered')) map.addLayer({ id: 'unclustered', type: 'circle', source: 'pois', filter: ['!', ['has', 'point_count']], paint: { 'circle-color': color, 'circle-radius': 7, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2 } });\n    if (!map.getLayer('poi-selected')) map.addLayer({ id: 'poi-selected', type: 'circle', source: 'pois', filter: ['==', ['get', 'id'], this.state.selectedId || '__none__'], paint: { 'circle-color': color, 'circle-radius': 11, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 3 } });\n  }\n  setDraft(field, v) { this.setState(s => ({ draft: { ...s.draft, [field]: v } })); }\n\n  saveModal() {\n    const d = this.state.draft;\n    if (!d.name.trim()) return;\n    const lat = parseFloat(d.lat) || 52.3676;\n    const lng = parseFloat(d.lng) || 4.9041;\n    const tags = d.tagsText.split(',').map(t => t.trim()).filter(Boolean);\n    if (this.state.modalMode === 'edit' && d.id) {\n      this.setState(s => ({\n        modalOpen: false,\n        pois: s.pois.map(p => p.id === d.id ? { ...p, name: d.name, category: d.category, address: d.address, lat, lng, phone: d.phone, website: d.website, email: d.email, notes: d.notes, tags } : p)\n      }), () => this.refreshData());\n    } else {\n      const id = 'poi-new-' + Date.now();\n      const np = { id, name: d.name, category: d.category, address: d.address, lat, lng, phone: d.phone || '\\u2014', website: d.website || '\\u2014', email: d.email || '\\u2014', notes: d.notes || '\\u2014', tags };\n      this.setState(s => ({ modalOpen: false, pois: [np, ...s.pois], selectedId: id, detailOpen: true }), () => { this.refreshData(); if (this.map) this.map.flyTo({ center: [lng, lat], zoom: 15, duration: 600 }); });\n    }\n  }\n\n  deleteSelected() {\n    const id = this.state.selectedId;\n    if (!id) return;\n    this.setState(s => ({ pois: s.pois.filter(p => p.id !== id), detailOpen: false, selectedId: null }), () => this.refreshData());\n  }\n\n  fitResults() {\n    if (!this.map || !window.maplibregl) return;\n    const f = this.getFiltered();\n    if (!f.length) return;\n    const b = new maplibregl.LngLatBounds();\n    f.forEach(p => b.extend([p.lng, p.lat]));\n    this.map.fitBounds(b, { padding: 60, maxZoom: 15, duration: 600 });\n  }\n\n  exportGeoJSON() {\n    const fc = { type: 'FeatureCollection', features: this.getFiltered().map(p => ({\n      type: 'Feature',\n      geometry: { type: 'Point', coordinates: [p.lng, p.lat] },\n      properties: { name: p.name, category: p.category, address: p.address, phone: p.phone, website: p.website, email: p.email, tags: p.tags, notes: p.notes }\n    })) };\n    const blob = new Blob([JSON.stringify(fc, null, 2)], { type: 'application/geo+json' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'waypoint-places.geojson';\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n  }\n\n  importClick() { if (this.fileRef.current) this.fileRef.current.click(); }\n  onFileChange(e) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      try {\n        const txt = reader.result;\n        let added = [];\n        if (file.name.endsWith('.csv')) {\n          const lines = txt.split(/\\r?\\n/).filter(Boolean);\n          const head = lines.shift().split(',').map(h => h.trim().toLowerCase());\n          added = lines.map((ln, i) => {\n            const c = ln.split(',');\n            const get = (k) => { const idx = head.indexOf(k); return idx >= 0 ? (c[idx] || '').trim() : ''; };\n            return { id: 'poi-imp-' + Date.now() + '-' + i, name: get('name') || 'Imported', category: this.catMap[get('category')] ? get('category') : 'store', address: get('address'), lat: parseFloat(get('lat') || get('latitude')) || 52.37, lng: parseFloat(get('lng') || get('longitude')) || 4.9, phone: get('phone') || '\\u2014', website: get('website') || '\\u2014', email: get('email') || '\\u2014', notes: get('notes') || '\\u2014', tags: (get('tags') || '').split(/[;|]/).filter(Boolean) };\n          });\n        } else {\n          const j = JSON.parse(txt);\n          const feats = j.features || [];\n          added = feats.map((f, i) => {\n            const pr = f.properties || {};\n            const co = (f.geometry && f.geometry.coordinates) || [4.9, 52.37];\n            return { id: 'poi-imp-' + Date.now() + '-' + i, name: pr.name || 'Imported', category: this.catMap[pr.category] ? pr.category : 'store', address: pr.address || '', lat: co[1], lng: co[0], phone: pr.phone || '\\u2014', website: pr.website || '\\u2014', email: pr.email || '\\u2014', notes: pr.notes || '\\u2014', tags: Array.isArray(pr.tags) ? pr.tags : [] };\n          });\n        }\n        if (added.length) this.setState(s => ({ pois: [...added, ...s.pois] }), () => { this.refreshData(); setTimeout(() => this.fitResults(), 50); });\n      } catch (err) { console.warn('Import failed', err); }\n      e.target.value = '';\n    };\n    reader.readAsText(file);\n  }\n\n  // ---- map ----\n  componentDidMount() {\n    this._mapTimer = setInterval(() => {\n      if (window.maplibregl && this.mapRef.current && !this.map) {\n        clearInterval(this._mapTimer);\n        this.initMap();\n      }\n    }, 60);\n  }\n  componentWillUnmount() { clearInterval(this._mapTimer); if (this._ro) this._ro.disconnect(); if (this.map) this.map.remove(); }\n\n  initMap() {\n    const map = new maplibregl.Map({ container: this.mapRef.current, style: this.styleUrl(this.state.basemap), center: [4.9041, 52.3676], zoom: 11.4, attributionControl: true });\n    this.map = map;\n    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');\n    const hitLayers = () => ['clusters', 'unclustered'].filter(l => map.getLayer(l));\n    map.on('load', () => { this.addPoiLayers(); this.fitResults(); });\n    map.on('click', (e) => {\n      const feats = map.queryRenderedFeatures(e.point, { layers: hitLayers() });\n      if (!feats.length) {\n        if (this.state.modalOpen && this.state.modalMode === 'add') {\n          this.setState(s => ({ draft: { ...s.draft, lat: e.lngLat.lat.toFixed(5), lng: e.lngLat.lng.toFixed(5) } }));\n        }\n        return;\n      }\n      const f = feats[0];\n      if (f.properties.point_count) {\n        const src = map.getSource('pois');\n        Promise.resolve(src.getClusterExpansionZoom(f.properties.cluster_id)).then(z => map.easeTo({ center: f.geometry.coordinates, zoom: z, duration: 500 }));\n      } else {\n        this.select(f.properties.id);\n      }\n    });\n    map.on('mousemove', (e) => { map.getCanvas().style.cursor = map.queryRenderedFeatures(e.point, { layers: hitLayers() }).length ? 'pointer' : ''; });\n    this._ro = new ResizeObserver(() => map.resize());\n    this._ro.observe(this.mapRef.current);\n  }\n\n  componentDidUpdate() {\n    const sig = this.state.search + '|' + this.state.activeCats.join(',') + '|' + this.state.pois.length;\n    if (sig !== this._prevFilterSig) { this._prevFilterSig = sig; this.refreshData(); }\n    if (this.state.selectedId !== this._prevSelected) {\n      this._prevSelected = this.state.selectedId;\n      if (this.map && this.map.getLayer('poi-selected')) this.map.setFilter('poi-selected', ['==', ['get', 'id'], this.state.selectedId || '__none__']);\n      const p = this.state.pois.find(x => x.id === this.state.selectedId);\n      if (p && this.map) this.map.flyTo({ center: [p.lng, p.lat], zoom: Math.max(this.map.getZoom(), 14), duration: 600 });\n    }\n  }\n\n  // ---- render ----\n  renderVals() {\n    const inputStyle = 'width:100%;padding:10px 12px;border:1px solid #e7e5e1;border-radius:10px;font-family:Manrope,sans-serif;font-size:13.5px;background:#fafaf9;outline:none;color:#1a1a1a';\n    const monoInputStyle = inputStyle + \";font-family:'JetBrains Mono',monospace;font-size:12.5px\";\n    const textareaStyle = inputStyle + ';resize:vertical;line-height:1.5';\n\n    const active = this.state.activeCats;\n    const counts = {};\n    this.CATS.forEach(c => counts[c.id] = 0);\n    this.state.pois.forEach(p => { if (counts[p.category] != null) counts[p.category]++; });\n\n    const cats = this.CATS.map(c => {\n      const on = active.includes(c.id);\n      const chipStyle = 'display:flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-family:Manrope,sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;'\n        + (on ? ('background:' + c.color + ';color:#fff;border:1px solid ' + c.color) : 'background:#fff;color:#5c574f;border:1px solid #e7e5e1');\n      return { id: c.id, label: c.label, count: counts[c.id], dotColor: on ? '#ffffff' : c.color, chipStyle, onToggle: () => this.toggleCat(c.id) };\n    });\n\n    const anyActive = active.length > 0;\n    const allChipStyle = 'border-radius:999px;padding:6px 13px;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;cursor:pointer;'\n      + (anyActive ? 'background:#fff;color:#5c574f;border:1px solid #e7e5e1' : 'background:#4f46e5;color:#fff;border:1px solid #4f46e5');\n\n    const filteredRaw = this.getFiltered();\n    const filtered = filteredRaw.map(p => {\n      const cat = this.catMap[p.category] || { label: '', color: '#888', tint: '#eee' };\n      const isSel = p.id === this.state.selectedId;\n      const cardStyle = 'display:flex;flex-direction:column;border-radius:12px;cursor:pointer;overflow:hidden;background:#fff;transition:border-color .12s,transform .12s,box-shadow .12s;'\n        + (isSel ? 'border:1.5px solid #4f46e5;box-shadow:0 4px 14px rgba(79,70,229,.18)' : 'border:1px solid #f1f0ee');\n      const city = p.city || (p.address && p.address.includes(',') ? p.address.split(',').pop().trim() : 'Amsterdam');\n      const flag = p.flag || '🇳🇱';\n      return {\n        id: p.id, name: p.name, categoryLabel: cat.label, color: cat.color, tintColor: cat.tint,\n        city, flag, address: p.address, thumbCss: \"url('\" + this.photoFor(p, 120) + \"')\",\n        tagPills: p.tags.slice(0, 2),\n        cardStyle, onClick: () => this.select(p.id)\n      };\n    });\n\n    const selP = this.state.pois.find(x => x.id === this.state.selectedId);\n    let selected = null;\n    if (selP) {\n      const cat = this.catMap[selP.category] || { label: '', color: '#888', tint: '#eee' };\n      selected = {\n        id: selP.id, name: selP.name, categoryLabel: cat.label, color: cat.color, tintColor: cat.tint,\n        address: selP.address, coordText: selP.lat.toFixed(5) + ', ' + selP.lng.toFixed(5),\n        phone: selP.phone, website: selP.website, websiteHref: selP.website && selP.website !== '\\u2014' ? 'https://' + selP.website.replace(/^https?:\\/\\//, '') : '#',\n        email: selP.email, mailHref: 'mailto:' + selP.email, tags: selP.tags, notes: selP.notes,\n        photoCss: \"url('\" + this.photoFor(selP, 600) + \"')\"\n      };\n    }\n\n    const d = this.state.draft;\n\n    const segBase = 'flex:1;padding:10px;border-radius:9px;font-family:Manrope,sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;';\n    const bmColorStyle = segBase + (this.state.basemap === 'voyager' ? 'background:#4f46e5;color:#fff;border:1px solid #4f46e5' : 'background:#fff;color:#5c574f;border:1px solid #e7e5e1');\n    const bmLightStyle = segBase + (this.state.basemap === 'light' ? 'background:#4f46e5;color:#fff;border:1px solid #4f46e5' : 'background:#fff;color:#5c574f;border:1px solid #e7e5e1');\n    const roleTint = { Admin: '#eef0fe', Editor: '#e0f0e7', Viewer: '#f0eeec' };\n    const roleFg = { Admin: '#4f46e5', Editor: '#1e7a47', Viewer: '#6b655d' };\n    const members = this.MEMBERS.map(m => ({\n      name: m.name, email: m.email, role: m.role, initials: m.initials,\n      avatarBg: 'linear-gradient(135deg,' + m.color + 'cc,' + m.color + ')',\n      roleStyle: 'font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;flex-shrink:0;background:' + roleTint[m.role] + ';color:' + roleFg[m.role]\n    }));\n\n    const asideStyle = 'flex:none;height:100%;background:#ffffff;border-right:1px solid #ececea;display:flex;flex-direction:column;position:relative;z-index:1000;overflow:hidden;transition:width .26s ease;min-width:0;'\n      + (this.state.panelCollapsed ? 'width:0;border-right:none' : 'width:480px');\n\n    return {\n      asideStyle, panelCollapsed: this.state.panelCollapsed, onTogglePanel: () => this.togglePanel(),\n      settingsOpen: this.state.settingsOpen,\n      onOpenSettings: () => this.openSettings(), onCloseSettings: () => this.closeSettings(),\n      members, memberCount: this.MEMBERS.length,\n      basemap: this.state.basemap, bmColorStyle, bmLightStyle,\n      onBasemapColor: () => this.setBasemap('voyager'), onBasemapLight: () => this.setBasemap('light'),\n      cats, allChipStyle, onClearCats: () => this.clearCats(),\n      search: this.state.search, onSearch: (e) => this.onSearch(e),\n      count: filtered.length, filtered,\n      onFitResults: () => this.fitResults(),\n      onExport: () => this.exportGeoJSON(),\n      onImportClick: () => this.importClick(), fileRef: this.fileRef, onFileChange: (e) => this.onFileChange(e),\n      mapRef: this.mapRef,\n      detailOpen: this.state.detailOpen && !!selected, selected,\n      onCloseDetail: () => this.closeDetail(), onEditSelected: () => this.openEdit(), onDeleteSelected: () => this.deleteSelected(),\n      modalOpen: this.state.modalOpen,\n      modalTitle: this.state.modalMode === 'edit' ? 'Edit place' : 'Add a new place',\n      saveLabel: this.state.modalMode === 'edit' ? 'Save changes' : 'Add place',\n      onOpenAdd: () => this.openAdd(), onCancelModal: () => this.cancelModal(), onSaveModal: () => this.saveModal(),\n      stop: (e) => e.stopPropagation(),\n      draft: d,\n      setName: (e) => this.setDraft('name', e.target.value),\n      setCategory: (e) => this.setDraft('category', e.target.value),\n      setAddress: (e) => this.setDraft('address', e.target.value),\n      setLat: (e) => this.setDraft('lat', e.target.value),\n      setLng: (e) => this.setDraft('lng', e.target.value),\n      setPhone: (e) => this.setDraft('phone', e.target.value),\n      setWebsite: (e) => this.setDraft('website', e.target.value),\n      setEmail: (e) => this.setDraft('email', e.target.value),\n      setNotes: (e) => this.setDraft('notes', e.target.value),\n      setTags: (e) => this.setDraft('tagsText', e.target.value),\n      inputStyle, monoInputStyle, textareaStyle\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
