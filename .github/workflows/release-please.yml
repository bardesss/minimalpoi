name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Publish the image in this same job. A separate workflow triggered on
      # `release: published` would NOT fire, because the release is created by
      # the built-in GITHUB_TOKEN (GitHub does not trigger workflows from
      # token-authored events). So we build + push here, only when the merged
      # release PR actually cut a release.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: docker/setup-qemu-action@v3
        if: ${{ steps.release.outputs.release_created }}
      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.release.outputs.release_created }}
      - uses: docker/login-action@v3
        if: ${{ steps.release.outputs.release_created }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bardesss/minimalpoi:${{ steps.release.outputs.version }}
            ghcr.io/bardesss/minimalpoi:${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
            ghcr.io/bardesss/minimalpoi:${{ steps.release.outputs.major }}
            ghcr.io/bardesss/minimalpoi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
