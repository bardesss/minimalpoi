name: release-please
on:
  push:
    branches: [main]
  # Manual re-publish: recover a release whose image build hit a transient
  # failure (e.g. a Docker Hub timeout in buildx setup). Runs the same
  # build + push against the release tag, without cutting a new release.
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to (re)publish to GHCR, e.g. 3.4.0"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Decide whether to publish and which version + ref to build, from either
      # a freshly-cut release (push) or a manual re-publish (workflow_dispatch).
      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          v=""
          floating=false
          publish=false
          ref=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # The input is free text: validate before it reaches a tag, a ref
            # or a build arg. A manual re-publish of an old version must not
            # move the floating tags (latest, major, major.minor) backwards.
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::version must look like 1.2.3"
              exit 1
            }
            v="$INPUT_VERSION"
            publish=true
            ref="v$v"
          elif [ "$RELEASE_CREATED" = "true" ]; then
            v="$RELEASE_VERSION"
            publish=true
            floating=true
          fi
          {
            echo "publish=$publish"
            echo "ref=$ref"
            echo "floating=$floating"
            if [ -n "$v" ]; then
              echo "version=$v"
              echo "major=${v%%.*}"
              echo "minor=$(printf '%s' "$v" | cut -d. -f2)"
            fi
          } >> "$GITHUB_OUTPUT"

      # Publish the image in this same job. A separate workflow triggered on
      # `release: published` would NOT fire, because the release is created by
      # the built-in GITHUB_TOKEN (GitHub does not trigger workflows from
      # token-authored events). On push we build the freshly-released HEAD; on
      # a manual re-publish we check out the release tag so the image matches
      # exactly what was released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.meta.outputs.publish == 'true'
        with:
          ref: ${{ steps.meta.outputs.ref }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.meta.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.meta.outputs.publish == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.meta.outputs.publish == 'true'
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bardesss/minimalpoi:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.floating == 'true' && format('ghcr.io/bardesss/minimalpoi:{0}.{1}', steps.meta.outputs.major, steps.meta.outputs.minor) || '' }}
            ${{ steps.meta.outputs.floating == 'true' && format('ghcr.io/bardesss/minimalpoi:{0}', steps.meta.outputs.major) || '' }}
            ${{ steps.meta.outputs.floating == 'true' && 'ghcr.io/bardesss/minimalpoi:latest' || '' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
