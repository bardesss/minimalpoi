name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Run test files serially: a few suites (e.g. settings forms that populate
      # via an effect after the first paint) race against React state updates
      # under full file-parallelism on a loaded CI runner, producing flaky
      # findBy/value failures that don't reproduce single-threaded.
      - run: npx vitest run --no-file-parallelism
      - run: npx tsc -b
      - run: npm run build
