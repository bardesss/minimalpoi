name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"
          python-version: "3.14"
      # --frozen installs uv.lock exactly as committed and fails if it has
      # drifted from pyproject.toml, so CI exercises the same pinned versions
      # the image ships rather than re-resolving them.
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run --frozen python -m pytest -v
  backend-tests-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minimalpoi
          POSTGRES_PASSWORD: minimalpoi
          POSTGRES_DB: minimalpoi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minimalpoi"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://minimalpoi:minimalpoi@localhost:5432/minimalpoi
      TEST_POSTGRES_URL: postgresql+psycopg://minimalpoi:minimalpoi@localhost:5432/minimalpoi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"
          python-version: "3.14"
      # Same lock as the SQLite job, plus the `postgres` extra the runtime image
      # bakes in unconditionally.
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra postgres
      # Scoped to the dialect-sensitive suites: engine selection / URL
      # normalization / boolean-default (test_db_engine), the SQLite->Postgres
      # migration incl. the sequence reset (test_migrate_sqlite_to_postgres, whose
      # setup also runs create_all + _add_missing_columns and copies boolean
      # columns on real Postgres), the ON DELETE FK map (test_fk_ondelete), and
      # the delete-flow behaviour that map produces end-to-end against real
      # enforced foreign keys (test_postgres_delete_flows). Plus the two TRIP
      # purge tests from test_db_migrate.py, by node id rather than by file:
      # that module's other tests build their own `sqlite:///` engines and would
      # be meaningless (or fail) here, while these two are the branch's most
      # destructive path and only Postgres has both enforced foreign keys — the
      # reason `_retire_sync_account` reassigns before it deletes — and the
      # native `syncstatus` enum type the purge has to drop. The full app suite
      # is NOT run here: many pre-existing tests assume SQLite's non-enforcement
      # of foreign keys (they insert rows with dangling created_by FKs) and an
      # empty shared database, so they can't pass unmodified against a single
      # Postgres instance. Widening this job to the whole suite is a separate
      # follow-up (FK-satisfying fixtures + universal per-test isolation).
      - name: Run dialect + delete-flow tests against Postgres
        run: uv run --frozen python -m pytest -v tests/test_db_engine.py tests/test_migrate_sqlite_to_postgres.py tests/test_fk_ondelete.py tests/test_postgres_delete_flows.py tests/test_db_migrate.py::test_init_db_purges_the_trip_sync_schema tests/test_db_migrate.py::test_trip_purge_is_a_no_op_on_a_clean_database
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Run test files serially: a few suites (e.g. settings forms that populate
      # via an effect after the first paint) race against React state updates
      # under full file-parallelism on a loaded CI runner, producing flaky
      # findBy/value failures that don't reproduce single-threaded.
      - run: npx vitest run --no-file-parallelism
      - run: npx tsc -b
      - run: npm run build
